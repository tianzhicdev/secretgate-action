name: "secretgate"
description: "Scan your repo for leaked secrets with secretgate — zero-install, single file, stdlib Python."
author: "tianzhicdev"

inputs:
  scan:
    description: "What to scan: 'working' (tracked+untracked files), 'staged' (staged diff), 'history' (all git blobs)."
    default: "working"
    required: false
  path:
    description: "Path to scan when scan=working (default repo root)."
    default: "."
    required: false
  fail:
    description: "'true' = fail the job on findings, 'false' = report only (annotations still posted)."
    default: "true"
    required: false
  version:
    description: "secretgate version/tag to fetch, e.g. 'v1.2.5' or 'main'."
    # v1.2.7: default v1.2.3 -> v1.2.5. Rationale measured, not vibes: the
    # c83/c84 bless-range sweeps + C c79/c80/c81 stranger re-scores proved
    # v1.2.3 silently blesses (a) dictionary-word-embedded secrets (fixed
    # v1.2.4) and (b) mid-token 5-x-run embeds (fixed v1.2.5) on BOTH the
    # generic-keyword AND entropy-sweep paths. A default pin that carries a
    # MEASURED bless class is a consumer-safety call; churn cost measured 0
    # (fleet blast radius 0 newly-exposed v1.2.4-vs-v1.2.5, c86). Pair law
    # unchanged: upgrade the pair, never one half.
    default: "v1.2.5"
    required: false

outputs:
  findings:
    description: "Number of findings."
    value: ${{ steps.scan.outputs.findings }}

branding:
  icon: shield
  color: red

runs:
  using: "composite"
  steps:
    - name: Fetch secretgate
      shell: bash
      # Inputs are untrusted strings: never interpolate ${{ }} into the script
      # body (injection class hardened fleet-wide). Env indirection + a strict
      # charset allowlist; anything else exits 2 with the value shown as DATA.
      env:
        SG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if ! [[ "$SG_VERSION" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "::error::invalid version input '$SG_VERSION' (allowed: letters, digits, dot, dash, underscore, slash)" >&2
          exit 2
        fi
        dest="${RUNNER_TEMP}/secretgate.py"
        url="https://raw.githubusercontent.com/tianzhicdev/secretgate/refs/tags/${SG_VERSION}/secretgate.py"
        if ! curl -fsSL "$url" -o "$dest"; then
          curl -fsSL "https://raw.githubusercontent.com/tianzhicdev/secretgate/main/secretgate.py" -o "$dest"
        fi
        echo "SG=$dest" >> "$GITHUB_ENV"

    - name: Scan
      id: scan
      shell: bash
      # scan/fail are validated against CLOSED sets; path is passed as a quoted
      # array element from env (data, never code) and rejected if it contains
      # control/ANSI/quote chars that could smuggle flags into the CLI.
      env:
        SG_JSON_OUT: ${{ runner.temp }}/sg.json
        SG_SCAN: ${{ inputs.scan }}
        SG_FAIL: ${{ inputs.fail }}
        SG_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        case "$SG_SCAN" in
          staged|history|working) ;;
          *) echo "::error::invalid scan input '$SG_SCAN' (allowed: working, staged, history)" >&2; exit 2 ;;
        esac
        case "$SG_FAIL" in
          true|false) ;;
          *) echo "::error::invalid fail input '$SG_FAIL' (allowed: true, false)" >&2; exit 2 ;;
        esac
        if [[ "$SG_PATH" =~ [[:cntrl:]]|[\"\'\\\$\`] ]]; then
          echo "::error::invalid path input (control/quote characters)" >&2
          exit 2
        fi
        ARGS=(scan --json)
        case "$SG_SCAN" in
          staged)  ARGS+=(--staged) ;;
          history) ARGS+=(--history) ;;
          *)       ARGS+=("$SG_PATH") ;;
        esac
        python3 "$SG" "${ARGS[@]}" > "$SG_JSON_OUT"; rc=$?
        # v1.2.6 (C c72 defect #3): engine rc is PASSED THROUGH, never
        # swallowed by '|| true'. rc 0 (clean) and 1 (findings) are real
        # verdicts worth summarizing; anything >=2 means the scan never
        # completed — exit there with the engine's own code.
        if [ "$rc" -ge 2 ]; then exit "$rc"; fi
        n=$(python3 "$GITHUB_ACTION_PATH/summarize.py" "$SG_JSON_OUT" "$GITHUB_STEP_SUMMARY" "$rc")
        s_rc=$?
        if [ "$s_rc" -ne 0 ]; then
          # summarize refuses to bless a corrupt pipeline (missing/truncated/
          # non-list JSON): propagate, never map damage to findings=0.
          exit "$s_rc"
        fi
        echo "findings=$n" >> "$GITHUB_OUTPUT"
        if [ "$n" -gt 0 ] && [ "$SG_FAIL" = "true" ]; then
          echo "::error::secretgate found $n possible secret(s) — see job summary"
          exit 1
        fi
