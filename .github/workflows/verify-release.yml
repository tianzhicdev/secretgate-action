name: verify-release
on:
  push:
    paths:
      - proofs/**
  pull_request:
    paths:
      - proofs/**
  workflow_dispatch:

jobs:
  # Receipt gating via C's reusable workflow  (v0.9). Cross-repo composite
  # actions do NOT resolve; reusable workflows are GitHub's sharing primitive.
  # NOTE: quote the require address — YAML 1.1 parses an unquoted 0x... as a
  # hex int ("invalid for type tag:yaml.org,2002:int", run dies at 0s).
  verify-action-yml:
    uses: tianzhicdev/ethkey-lite/.github/workflows/verify-release.yml@e7edefea9e91420258bbf23999a8f54a3842d380  # v0.9 tag commit (A c78)
    with:
      receipt: "proofs/action-v1.2.7-proof.md"
      require: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
  verify-summarize:
    uses: tianzhicdev/ethkey-lite/.github/workflows/verify-release.yml@e7edefea9e91420258bbf23999a8f54a3842d380  # v0.9 tag commit (A c78)
    with:
      receipt: "proofs/summarize-v1.2.6-proof.md"
      require: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"

  # C's c23 caller-selftest class mirrored from THIS consumer (both called
  # jobs checked): the reusable workflow advertises a `signer` job output,
  # but until this job NO consumer anywhere asserted its VALUE from outside
  # C's repo (the c22 gap-(a) class one level up from the action
  # findings-output I pinned in c26). CONTRACT (C's c23 live finding, run
  # 33336191895): the output carries EIP-55 checksummed casing while
  # `require` matching inside the gate is lowercase-compared -> compare
  # CASE-FOLDED, never byte-equal. Failure propagation (verify red -> this
  # job SKIPPED) proven by C's red control run 33336194432.
  check-signer-output:
    needs: [verify-action-yml, verify-summarize]
    runs-on: ubuntu-latest
    steps:
      - name: Assert reusable-workflow signer job output (both receipts)
        env:
          SIGNER_A: ${{ needs.verify-action-yml.outputs.signer }}
          SIGNER_S: ${{ needs.verify-summarize.outputs.signer }}
          WANT: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
        run: |
          set -euo pipefail
          echo "caller saw action.yml receipt signer = [$SIGNER_A]"
          echo "caller saw summarize.py receipt signer = [$SIGNER_S]"
          WANT_FOLDED=$(printf '%s' "$WANT" | tr 'A-Z' 'a-z')
          for pair in "action-yml|$SIGNER_A" "summarize|$SIGNER_S"; do
            name="${pair%%|*}"; signer="${pair#*|}"
            test -n "$signer" || { echo "FAIL: $name produced empty signer output"; exit 1; }
            got=$(printf '%s' "$signer" | tr 'A-Z' 'a-z')
            test "$got" = "$WANT_FOLDED" || { echo "FAIL: $name signer != A wallet addr (case-folded)"; exit 1; }
            echo "OK: $name signer job-output asserted from A's caller side"
          done
          echo "OK: signer job-output wiring proven from A's caller side (case-folded compare x2)"

  # Negative controls: the verifier's REJECTIONS are pinned as committed
  # attack fixtures (C's aae8009 pattern, mirrored from secretgate 0529210 / hookpack 513008d — this closes the fleet mirror).
  # A green "verified" badge means nothing unless the same code fails these.
  # Fixtures are signed by the PUBLIC throwaway key (private key = 0x…0003,
  # literally public), so anyone can reproduce the attack locally — see README.
  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)
        with:
          persist-credentials: false
      - name: Checkout ethkey-lite (verifier tool, pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)
        with:
          repository: tianzhicdev/ethkey-lite
          ref: v0.9
          path: .ethkey-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (A c39/B c31)
        with:
          python-version: '3.11'
      - name: Run rejection matrix
        shell: bash
        env:
          A_ADDR: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
          PK3_ADDR: "0x6813Eb9362372EEF6200f3b1dbC3f819671cBA69"
        run: |
          set -euo pipefail
          pip install --quiet pycryptodome
          EK="python3 .ethkey-tools/ethkey.py"
          # c35 CONTENT PIN: the checkout ref alone can drift silently — if
          # the tag is ever force-moved or a repoint forgets this line, the
          # matrix would run an UNPINNED verifier (exactly the pinned-ref
          # drift class my c32/c34 probes proved real). Fail closed.
          echo "e582cb0148e9fdc39470c0fff31881f5465c0635928a597ec7170977d39a5a60  .ethkey-tools/ethkey.py" | sha256sum -c - --status \
            && echo "ok: verifier tool content-pinned (sha256 e582cb01..)" \
            || { echo "FAIL: ethkey.py content != pinned sha (tag moved?)"; exit 1; }
          fails=0
          expect() { # expect <exit|!exit> <desc> <cmd...>
            local want="$1" desc="$2"; shift 2
            local out rc=0
            out="$("$@" 2>&1)" || rc=$?
            if { [ "$want" = "exit" ] && [ "$rc" -eq 0 ]; } || \
               { [ "$want" = "!exit" ] && [ "$rc" -ne 0 ]; }; then
              echo "FAIL: $desc (rc=$rc)"; echo "$out" | tail -1; fails=$((fails+1))
            else
              echo "ok: $desc (rc=$rc)"
            fi
          }
          # FORGED fixture: valid pk=3 signature, signer header forged to A's addr.
          expect exit "F1 forged fixture bare verify must FAIL" \
            $EK verify proofs/c23-forged-signer-fixture.md
          expect exit "F2 forged fixture --require A must FAIL" \
            $EK verify proofs/c23-forged-signer-fixture.md --require "$A_ADDR"
          expect exit "F3 forged fixture --require TRUE signer must FAIL (header != recovered)" \
            $EK verify proofs/c23-forged-signer-fixture.md --require "$PK3_ADDR"
          # THROWAWAY fixture: genuine pk=3 receipt, header honest.
          expect !exit "T1 throwaway fixture bare verify must PASS" \
            $EK verify proofs/c23-throwaway-signed-fixture.md
          expect exit "T2 throwaway fixture --require A must FAIL" \
            $EK verify proofs/c23-throwaway-signed-fixture.md --require "$A_ADDR"
          expect !exit "T3 throwaway fixture --require true signer must PASS" \
            $EK verify proofs/c23-throwaway-signed-fixture.md --require "$PK3_ADDR"
          # Positive control: the real release receipt still verifies.
          expect !exit "P1 latest action receipt (v1.2.7) --require A must PASS" \
            $EK verify proofs/action-v1.2.7-proof.md --require "$A_ADDR"
          if [ "$fails" -ne 0 ]; then echo "$fails negative-control asserts FAILED"; exit 1; fi
          echo "negative controls: 7/7 rejections behave as pinned"