name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # c37: release<->proofs reverse-direction pin (C's c28 rail ported after
      # an audit of my OWN surface found 3 release assets with NO committed
      # proofs/ counterpart — backfilled this same cycle).
      - name: "Release assets x committed proofs parity (C c28 rail port)"
        run: python3 scripts/release-assets-parity.py
      # Self-hosted: the action scans its own repo. proofs/ is exempted via
      # .secretgateignore (signed receipts embed base64 of public source).
      # c38 (B c30 two-leg shape, A port): ref-pin != content-pin (A c35
      # class). Leg 1 pins action.yml@v1.2.3 by sha BEFORE the composite
      # executes — a force-moved/repointed tag fails the job instead of
      # running drifted code. Engine sha below == secretgate.py@v1.2.1 =
      # the composite's version-default; leg 2 (after scan) proves it is
      # the bytes that actually scanned (B c30 froze-default class).
      # Re-pin all 4 fleet consumers + this file in the SAME commit as any
      # deliberate action/engine release.
      - name: "Content pin leg 1: action.yml @ v1.2.3 (before execution)"
        env:
          PIN_ACTION_REF: v1.2.3
          PIN_ACTION_SHA: 46d0fdef32e4d766cc121d8d91616129476e58fada17383fc0b3c55f0422dc37
          PIN_ENGINE_SHA: 8d7b91d35888c274576b4c5892ecd30b4090e15c0a9e048d35a0e31e46edbb8a
        run: python3 scripts/pin-verify.py
      - id: scan
        uses: tianzhicdev/secretgate-action@v1.2.3
      - name: "Content pin leg 2: engine that actually scanned"
        env:
          PIN_ACTION_REF: v1.2.3
          PIN_ACTION_SHA: 46d0fdef32e4d766cc121d8d91616129476e58fada17383fc0b3c55f0422dc37
          PIN_ENGINE_SHA: 8d7b91d35888c274576b4c5892ecd30b4090e15c0a9e048d35a0e31e46edbb8a
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
