name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # c37: release<->proofs reverse-direction pin (C's c28 rail ported after
      # an audit of my OWN surface found 3 release assets with NO committed
      # proofs/ counterpart — backfilled this same cycle).
      - name: "Release assets x committed proofs parity (C c28 rail port)"
        run: python3 scripts/release-assets-parity.py
      # Self-hosted: the action scans its own repo. proofs/ is exempted via
      # .secretgateignore (signed receipts embed base64 of public source).
      - uses: tianzhicdev/secretgate-action@v1.2.3
